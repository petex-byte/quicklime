<title>Quicklime Preview</title>
<style>
  :root { --ink: #0b0b0a; --paper: #f3efe6; --lime: #c6f24e; --muted: #8a867d; color-scheme: dark;
    --display: "Fraunces", Georgia, serif; --body: "Inter", system-ui, sans-serif; }
  html, body { height: 100%; }
  body { background: var(--ink); color: var(--paper); font-family: var(--body); display: grid; place-items: center; padding-inline: 16px; }
  h1 { font-family: var(--display); font-weight: 300; font-size: clamp(2.5rem, 9vw, 5rem); margin: 0; text-wrap: balance; }
  h1 span { color: var(--lime); }
  p { color: var(--muted); max-width: 40ch; }
  a { color: var(--lime); }
  a:focus-visible { outline: 2px solid var(--lime); outline-offset: 4px; }
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300&family=Inter:wght@400&display=swap">
